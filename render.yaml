databases:
  - name: boss-postgres
    databaseName: boss_pickleball
    user: boss_admin
    plan: free

services:
  # 1. Django REST Web API + Celery Worker & Beat (Bundled for Free Tier)
  - type: web
    name: boss-django-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: ./build.sh
    startCommand: ./start.sh
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: boss-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: boss-redis
          property: connectionString

  # 2. Redis Cache & Celery Message Broker
  - type: redis
    name: boss-redis
    plan: free
    ipAllowList: [] # internal access only
